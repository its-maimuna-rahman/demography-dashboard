[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vitalstats-suite"
version = "2.0.0"
description = "Comprehensive Demographic Intelligence, Vital Statistics Analysis, and Policy Projection Suite"
readme = "README.md"
authors = [{ name = "Maimuna" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.46.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.15.0",
    "reportlab>=4.0.0",
    "requests>=2.28.0",
    "matplotlib>=3.7.0",   # renders LaTeX formulas to SVG
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
